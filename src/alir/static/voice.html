<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>alir voice</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 1rem; min-height: 100dvh; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 1rem;
      background: #10141a; color: #e6e9ee;
      font-family: system-ui, sans-serif;
    }
    header { display: flex; align-items: baseline; gap: .75rem; }
    h1 { margin: 0; font-size: 1.1rem; }
    #status { font-size: .85rem; color: #8b95a5; }
    #status.active { color: #4cc38a; }
    #call {
      font-size: 1.2rem; padding: 1.1rem; border-radius: 999px; border: none;
      background: #2563eb; color: #fff; cursor: pointer;
    }
    #call.calling { background: #dc2626; }
    #transcript {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .4rem;
      font-size: .95rem; line-height: 1.5;
    }
    #transcript div { padding: .35rem .6rem; border-radius: .5rem; background: #1b2230; }
    #transcript div.error { background: #3a1f24; color: #f0a3a3; }
    footer { font-size: .75rem; color: #626c7d; }
  </style>
</head>
<body>
  <header>
    <h1>alir voice</h1>
    <span id="status">未接続</span>
  </header>
  <button id="call" type="button">通話開始</button>
  <div id="transcript"></div>
  <footer>マイクは端末側で 16kHz PCM に変換してサーバへ送る。認識・合成はサーバ側で行う。</footer>
  <script src="/static/voice.js"></script>
</body>
</html>
