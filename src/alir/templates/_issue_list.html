{% if error %}<p class="error">{{ error }}</p>{% endif %}
{% for issue in items %}
<div class="card st-{{ issue.status }}">
  <div class="card-top">
    <span class="status">{{ issue.status }}</span>
    <span>#{{ issue.id }}</span>
    <span>priority {{ issue.priority }}</span>
  </div>
  <p class="issue-ref"><a href="{{ issue.url }}">{{ issue.ref }}</a></p>
  <p class="workdir">{{ issue.workdir }}</p>
  {% if issue.status == "failed" %}
  <form class="requeue" method="post" action="/issues/{{ issue.id }}/requeue"
        hx-post="/issues/{{ issue.id }}/requeue" hx-target="#issues" hx-swap="innerHTML">
    <button>キューに戻して再実行</button>
  </form>
  {% endif %}
</div>
{% else %}
<p class="empty">登録された Issue はありません。<br>上のフォームから消化したい Issue を追加できます。</p>
{% endfor %}
