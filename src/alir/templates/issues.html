{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1>Issue キュー</h1>
</div>
<div class="card add-form">
  <form method="post" action="/issues/add"
        hx-post="/issues/add" hx-target="#issues" hx-swap="innerHTML">
    <div class="field">
      <label for="issue-url">Issue URL</label>
      <input id="issue-url" type="text" name="url"
             placeholder="https://github.com/owner/repo/issues/123">
    </div>
    <div class="field">
      <label for="issue-workdir">ローカルパス</label>
      <input id="issue-workdir" type="text" name="workdir" list="workdirs"
             placeholder="対象リポジトリのローカルパス">
    </div>
    <datalist id="workdirs">
      {% for workdir in workdirs %}<option value="{{ workdir }}">{% endfor %}
    </datalist>
    <button>キューに登録</button>
  </form>
</div>
<div id="issues">
{% include "_issue_list.html" %}
</div>
{% endblock %}
