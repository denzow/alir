{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1>Issue キュー</h1>
</div>
<div class="card add-form">
  <form method="post" action="/issues/add"
        hx-post="/issues/add" hx-target="#issues" hx-swap="innerHTML">
    <input type="text" name="url" placeholder="https://github.com/owner/repo/issues/123">
    <input type="text" name="workdir" list="workdirs" placeholder="対象リポジトリのローカルパス">
    <datalist id="workdirs">
      {% for workdir in workdirs %}<option value="{{ workdir }}">{% endfor %}
    </datalist>
    <button>キューに登録</button>
  </form>
</div>
<div id="issues">
{% include "_issue_list.html" %}
</div>
{% endblock %}
