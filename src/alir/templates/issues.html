{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1>Issue キュー</h1>
</div>
<div class="card add-form">
  <form method="post" action="/issues/add"
        hx-post="/issues/add" hx-target="#issues" hx-swap="innerHTML">
    <div class="field">
      <label for="issue-url">Issue URL</label>
      <input id="issue-url" type="text" name="url"
             placeholder="https://github.com/owner/repo/issues/123">
    </div>
    <div class="field">
      <label for="issue-workdir">ローカルパス</label>
      <input id="issue-workdir" type="text" name="workdir" list="workdirs"
             placeholder="対象リポジトリのローカルパス">
    </div>
    <datalist id="workdirs">
      {% for workdir in workdirs %}<option value="{{ workdir }}">{% endfor %}
    </datalist>
    <button>キューに登録</button>
  </form>
</div>
<div id="issues">
{% include "_issue_list.html" %}
</div>
<script src="/static/sortable.min.js"></script>
<script>
htmx.onLoad(function () {
  var list = document.getElementById("queue-list");
  if (!list || list._sortable) return;
  list._sortable = new Sortable(list, {
    handle: ".drag-handle",
    animation: 150,
    onEnd: function () {
      var ids = Array.from(list.querySelectorAll("[data-issue-id]"))
        .map(function (el) { return el.dataset.issueId; });
      htmx.ajax("POST", "/issues/reorder", {
        target: "#issues",
        swap: "innerHTML",
        values: { order: ids.join(",") },
      });
    },
  });
});
</script>
{% endblock %}
