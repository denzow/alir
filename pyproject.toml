[project]
name = "alir"
version = "0.1.0"
description = "Claude Code の自律ループを支える非同期判断サービス"
readme = "README.md"
authors = [
    { name = "denzow", email = "denzow@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "iceql>=0.3.0",
    "click>=8.1",
    "mcp>=1.0",
    "uvicorn>=0.52.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "wsproto>=1.3.2",
]

[project.scripts]
alir = "alir.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/alir"]

[[tool.mypy.overrides]]
module = ["mcp.*", "iceql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
